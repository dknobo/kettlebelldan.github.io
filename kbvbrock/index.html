<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DAN vs BROCK</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07070a; overflow: hidden; font-family: Impact, Haettenschweiler, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const canvas = document.getElementById('c')
      const ctx = canvas.getContext('2d')
      const W = 1280, H = 720
      const GROUND = 590
      canvas.width = W
      canvas.height = H

      const danImg = new Image()
      const brockImg = new Image()
      danImg.src = '/kbvbrock/dan.jpg'
      brockImg.src = '/kbvbrock/brock.jpg'

      const keys = {}
      addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if (e.code === 'Space') e.preventDefault() })
      addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false })

      const demo = true
      let t = 0
      let phase = 'vs'
      let phaseT = 0
      let shake = 0
      const fx = []
      const shots = []

      function fighter(name, x, face, color) {
        return { name, x, y: GROUND, vx: 0, vy: 0, face, hp: 100, max: 100, color, punch: 0, special: 0, hurt: 0, crouch: 0, air: false }
      }
      const dan = fighter('DAN', 340, 1, '#e8b84a')
      const brock = fighter('BROCK', 940, -1, '#e23d3d')

      function hit(a, b, dmg, knock) {
        if (b.hurt > 0) return
        const dx = b.x - a.x
        if (Math.sign(dx || 1) !== a.face) return
        if (Math.abs(dx) > 118 || Math.abs(b.y - a.y) > 80) return
        b.hp = Math.max(0, b.hp - dmg)
        b.hurt = 0.28
        b.vx = a.face * knock
        b.vy = -180
        shake = Math.max(shake, 10)
        burst(b.x, b.y - 90, a.color)
        if (b.hp <= 0) { phase = 'ko'; phaseT = 0 }
      }

      function burst(x, y, color) {
        for (let i = 0; i < 10; i++) {
          const a = Math.random() * Math.PI * 2
          fx.push({ x, y, vx: Math.cos(a) * (80 + Math.random() * 220), vy: Math.sin(a) * (80 + Math.random() * 220), life: 0.35, color, r: 3 + Math.random() * 4 })
        }
      }

      function kettlebell(x, y, s, ang) {
        ctx.save()
        ctx.translate(x, y)
        ctx.rotate(ang)
        ctx.fillStyle = '#d4a017'
        ctx.beginPath(); ctx.ellipse(0, 10 * s, 16 * s, 14 * s, 0, 0, Math.PI * 2); ctx.fill()
        ctx.strokeStyle = '#f3d36a'; ctx.lineWidth = 5 * s
        ctx.beginPath(); ctx.arc(0, -8 * s, 10 * s, Math.PI * 0.15, Math.PI * 0.85, true); ctx.stroke()
        ctx.restore()
      }

      function hotdog(x, y, ang) {
        ctx.save()
        ctx.translate(x, y)
        ctx.rotate(ang)
        ctx.fillStyle = '#e39a3c'
        ctx.beginPath(); ctx.roundRect(-16, -6, 32, 12, 6); ctx.fill()
        ctx.fillStyle = '#c45a2a'
        ctx.beginPath(); ctx.roundRect(-12, -3, 24, 6, 4); ctx.fill()
        ctx.restore()
      }

      function head(img, x, y, r, flip) {
        ctx.save()
        ctx.translate(x, y)
        if (flip < 0) ctx.scale(-1, 1)
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip()
        if (img.complete && img.naturalWidth) ctx.drawImage(img, -r, -r, r * 2, r * 2)
        ctx.restore()
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'
        ctx.lineWidth = 3
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke()
      }

      function drawFighter(f, img) {
        const punch = f.punch > 0
        const spec = f.special > 0
        const bob = Math.sin(t * 8) * (f.air ? 0 : 3)
        const bodyY = f.y + bob
        ctx.save()
        ctx.translate(f.x, bodyY)
        ctx.scale(f.face, 1)
        // body
        ctx.fillStyle = f === dan ? '#1b1b1f' : '#f2f2f2'
        ctx.beginPath(); ctx.roundRect(-22, -78, 44, 70, 12); ctx.fill()
        ctx.fillStyle = f === dan ? '#2a2a30' : '#dcdcdc'
        ctx.fillRect(-18, -20, 16, 22)
        ctx.fillRect(2, -20, 16, 22)
        // arms
        ctx.strokeStyle = f === dan ? '#c9a07a' : '#e6c8a8'
        ctx.lineWidth = 10
        ctx.lineCap = 'round'
        if (punch) {
          ctx.beginPath(); ctx.moveTo(10, -58); ctx.lineTo(58, -50); ctx.stroke()
          ctx.beginPath(); ctx.moveTo(-12, -54); ctx.lineTo(-8, -20); ctx.stroke()
        } else if (spec && f === dan) {
          ctx.beginPath(); ctx.moveTo(8, -60); ctx.lineTo(36, -110); ctx.stroke()
          ctx.beginPath(); ctx.moveTo(-10, -52); ctx.lineTo(-4, -18); ctx.stroke()
        } else {
          ctx.beginPath(); ctx.moveTo(12, -56); ctx.lineTo(22, -22); ctx.stroke()
          ctx.beginPath(); ctx.moveTo(-12, -56); ctx.lineTo(-20, -22); ctx.stroke()
        }
        ctx.restore()
        head(img, f.x, bodyY - 108, 36, f.face)
        if (f === dan) {
          const swing = spec ? -1.2 + (0.45 - f.special) * 4 : punch ? 0.6 : Math.sin(t * 6) * 0.15
          kettlebell(f.x + f.face * (spec ? 42 : 34), bodyY - (spec ? 126 : 46), spec ? 1.25 : 1, swing)
        }
        if (f.hurt > 0) {
          ctx.fillStyle = `rgba(255,80,80,${f.hurt})`
          ctx.beginPath(); ctx.arc(f.x, bodyY - 90, 50, 0, Math.PI * 2); ctx.fill()
        }
      }

      function hud() {
        ctx.fillStyle = 'rgba(0,0,0,0.45)'
        ctx.fillRect(0, 0, W, 92)
        const bar = (x, align, f) => {
          ctx.fillStyle = '#1a1a1a'
          ctx.fillRect(x, 28, 420, 22)
          ctx.fillStyle = f.hp > 30 ? '#39d353' : '#ff4d4d'
          const w = 420 * (f.hp / f.max)
          ctx.fillRect(align === 'left' ? x : x + 420 - w, 28, w, 22)
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(x, 28, 420, 22)
          ctx.fillStyle = '#fff'
          ctx.font = '28px Impact'
          ctx.textAlign = align === 'left' ? 'left' : 'right'
          ctx.fillText(f.name, align === 'left' ? x : x + 420, 24)
        }
        bar(70, 'left', dan)
        bar(W - 490, 'right', brock)
        ctx.fillStyle = '#ffe566'
        ctx.font = '42px Impact'
        ctx.textAlign = 'center'
        ctx.fillText('K.B. FIGHTER', W / 2, 48)
        ctx.fillStyle = '#fff'
        ctx.font = '16px Impact'
        ctx.fillText('KETTLEBELL vs HOTDOG', W / 2, 72)
      }

      function bg() {
        const g = ctx.createLinearGradient(0, 0, 0, H)
        g.addColorStop(0, '#1a1028')
        g.addColorStop(0.55, '#3a1d2a')
        g.addColorStop(1, '#121018')
        ctx.fillStyle = g
        ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = '#2a1a16'
        ctx.fillRect(0, GROUND, W, H - GROUND)
        ctx.fillStyle = '#3d2a22'
        for (let i = 0; i < 18; i++) ctx.fillRect(i * 80, GROUND, 40, 8)
        ctx.fillStyle = 'rgba(255,180,60,0.08)'
        ctx.beginPath(); ctx.arc(W / 2, 180, 260, 0, Math.PI * 2); ctx.fill()
        ctx.fillStyle = '#0d0d12'
        ctx.fillRect(80, 180, 180, 410)
        ctx.fillRect(1020, 200, 180, 390)
        ctx.fillStyle = 'rgba(255,80,80,0.25)'
        ctx.font = '120px Impact'
        ctx.textAlign = 'center'
        ctx.fillText('vs', W / 2, 300)
      }

      function act(f, cmd) {
        if (phase !== 'fight' || f.hurt > 0.12) return
        if (cmd === 'left') f.vx = -240
        if (cmd === 'right') f.vx = 240
        if (cmd === 'jump' && !f.air) { f.vy = -620; f.air = true }
        if (cmd === 'punch' && f.punch <= 0 && f.special <= 0) {
          f.punch = 0.22
          hit(f, f === dan ? brock : dan, 7, 260)
        }
        if (cmd === 'special' && f.special <= 0) {
          f.special = 0.45
          if (f === dan) {
            hit(dan, brock, 16, 420)
            burst(dan.x + dan.face * 70, dan.y - 70, '#f3d36a')
          } else {
            shots.push({ x: brock.x + brock.face * 40, y: brock.y - 80, vx: brock.face * 520, vy: -40, life: 1.4, kind: 'dog' })
          }
        }
      }

      function demoAI(dt) {
        const s = t
        // scripted cinematic
        if (s < 2.2) { act(dan, 'right'); act(brock, 'left') }
        else if (s < 2.6) act(dan, 'punch')
        else if (s < 3.1) act(brock, 'jump')
        else if (s < 3.5) { act(brock, 'special'); act(brock, 'left') }
        else if (s < 4.0) act(dan, 'jump')
        else if (s < 4.4) act(dan, 'special')
        else if (s < 5.1) { act(brock, 'right'); act(brock, 'punch') }
        else if (s < 5.6) act(dan, 'left')
        else if (s < 6.0) act(dan, 'special')
        else if (s < 6.6) { act(brock, 'special'); act(brock, 'left') }
        else if (s < 7.2) act(dan, 'right')
        else if (s < 7.6) act(dan, 'punch')
        else if (s < 8.2) act(brock, 'jump')
        else if (s < 8.6) act(dan, 'special')
        else if (s < 9.3) act(brock, 'special')
        else if (s < 9.8) act(dan, 'jump')
        else if (s < 10.3) act(dan, 'special')
        else if (s < 11.0) { act(dan, 'right'); act(brock, 'left') }
        else if (s < 11.4) act(dan, 'special')
      }

      function step(dt) {
        t += dt
        phaseT += dt
        shake = Math.max(0, shake - dt * 40)
        if (phase === 'vs' && phaseT > 1.6) { phase = 'fight'; phaseT = 0; t = 0 }
        if (phase === 'fight' && demo) demoAI(dt)

        for (const f of [dan, brock]) {
          if (!demo && f === dan) {
            const L = keys['a'] || keys['arrowleft']
            const R = keys['d'] || keys['arrowright']
            f.vx = L ? -260 : R ? 260 : f.vx * 0.7
            if ((keys['w'] || keys['arrowup']) && !f.air) { f.vy = -620; f.air = true }
            if (keys['j'] || keys[' ']) act(f, 'punch')
            if (keys['k']) act(f, 'special')
          }
          f.vy += 1600 * dt
          f.x += f.vx * dt
          f.y += f.vy * dt
          f.vx *= Math.pow(0.08, dt)
          if (f.y >= GROUND) { f.y = GROUND; f.vy = 0; f.air = false }
          f.x = Math.max(80, Math.min(W - 80, f.x))
          f.punch = Math.max(0, f.punch - dt)
          f.special = Math.max(0, f.special - dt)
          f.hurt = Math.max(0, f.hurt - dt)
        }
        dan.face = dan.x < brock.x ? 1 : -1
        brock.face = brock.x < dan.x ? 1 : -1

        for (const s of shots) {
          s.x += s.vx * dt
          s.y += s.vy * dt
          s.vy += 200 * dt
          s.life -= dt
          if (Math.hypot(s.x - dan.x, s.y - (dan.y - 70)) < 50 && dan.hurt <= 0) {
            dan.hp = Math.max(0, dan.hp - 8)
            dan.hurt = 0.24
            dan.vx = Math.sign(s.vx) * 240
            s.life = 0
            burst(s.x, s.y, '#e39a3c')
            if (dan.hp <= 0) { phase = 'ko'; phaseT = 0 }
          }
        }
        for (let i = shots.length - 1; i >= 0; i--) if (shots[i].life <= 0) shots.splice(i, 1)
        for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt }
        for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1)
      }

      function draw() {
        ctx.save()
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake)
        bg()
        for (const s of shots) hotdog(s.x, s.y, t * 10)
        drawFighter(dan, danImg)
        drawFighter(brock, brockImg)
        for (const p of fx) {
          ctx.globalAlpha = Math.max(0, p.life * 3)
          ctx.fillStyle = p.color
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill()
        }
        ctx.globalAlpha = 1
        hud()
        if (phase === 'vs') {
          ctx.fillStyle = 'rgba(0,0,0,0.55)'
          ctx.fillRect(0, 0, W, H)
          head(danImg, 360, 340, 110, 1)
          head(brockImg, 920, 340, 110, 1)
          ctx.fillStyle = '#ffe566'
          ctx.font = '90px Impact'
          ctx.textAlign = 'center'
          ctx.fillText('VS', W / 2, 370)
          ctx.fillStyle = '#fff'
          ctx.font = '36px Impact'
          ctx.fillText('DAN', 360, 500)
          ctx.fillText('BROCK', 920, 500)
        }
        if (phase === 'fight' && phaseT < 0.8) {
          ctx.fillStyle = `rgba(255,230,80,${1 - phaseT / 0.8})`
          ctx.font = '120px Impact'
          ctx.textAlign = 'center'
          ctx.fillText('FIGHT', W / 2, H / 2)
        }
        if (phase === 'ko') {
          ctx.fillStyle = 'rgba(0,0,0,0.35)'
          ctx.fillRect(0, 0, W, H)
          ctx.fillStyle = '#ff2a2a'
          ctx.font = '140px Impact'
          ctx.textAlign = 'center'
          ctx.fillText('K.O.', W / 2, H / 2)
          ctx.fillStyle = '#fff'
          ctx.font = '36px Impact'
          ctx.fillText(dan.hp > 0 ? 'DAN WINS' : 'BROCK WINS', W / 2, H / 2 + 70)
        }
        ctx.restore()
      }

      let last = performance.now()
      function loop(now) {
        const dt = Math.min(0.033, (now - last) / 1000)
        last = now
        step(dt)
        draw()
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
