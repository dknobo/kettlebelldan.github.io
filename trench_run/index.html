<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>STAR WARS — TRENCH RUN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect fill='%23000' width='64' height='64'/><circle cx='32' cy='32' r='22' fill='none' stroke='%235dff8a' stroke-width='2'/><circle cx='32' cy='22' r='6' fill='none' stroke='%235dff8a' stroke-width='1.5'/><path d='M10 34h44' stroke='%235dff8a' stroke-width='2'/></svg>" />
</head>
<body>
  <div id="cabinet">
    <div id="bezel">
      <header id="topplate">
        <div class="plate-line">REBEL ALLIANCE TACTICAL COMPUTER</div>
        <div class="plate-sub">MASSASSI BASE · YAVIN IV · T-65 X-WING · RED FIVE</div>
      </header>
      <div id="crt">
        <canvas id="game" width="960" height="720" aria-label="Star Wars Trench Run"></canvas>
        <div id="scanlines"></div>
        <div id="vignette"></div>
        <div id="glass"></div>
      </div>
      <footer id="deck">
        <div class="lamp" id="lamp-shields"><span></span>SHIELDS</div>
        <div class="lamp" id="lamp-lock"><span></span>LOCK</div>
        <div class="lamp" id="lamp-force"><span></span>FORCE</div>
        <div class="lamp" id="lamp-torp"><span></span>TORPEDO</div>
        <div id="deck-legend">MOUSE STEER · FIRE TO SHOOT · F USE THE FORCE · T TORPEDO · M MUTE</div>
      </footer>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
